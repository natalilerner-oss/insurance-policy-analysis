[server]
port = 8000
address = "0.0.0.0"
headless = true
# CORS is handled by the backend Azure Function
# Set to true only if frontend and backend are on different domains
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#262730"
font = "sans serif"
