services:
  - type: web
    name: insurance-policy-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        value: https://your-azure-func-app.azurewebsites.net/api
      - key: JWT_SECRET
        sync: false
