services:
  - type: web
    name: insurance-policy-frontend
    runtime: python
    buildCommand: ./render_build.sh
    startCommand: python -m streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        value: https://policy-extractor-30058.azurewebsites.net/api
      - key: JWT_SECRET
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src
